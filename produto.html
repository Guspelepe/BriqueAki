<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrocaTudo - Detalhes do Produto</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        /* ===== ESTILOS DA PÁGINA DE PRODUTO ===== */
        /* ----- IMAGEM PRINCIPAL COM ZOOM (estilo Mercado Livre) ----- */
        .product-detail-page .gallery .image-container {
            width: 100%;
            height: 400px;
            border-radius: 12px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .product-detail-page .gallery .image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* Miniaturas */
        .product-detail-page .gallery .thumbnails {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .product-detail-page .gallery .thumbnails img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid #e2e8f0;
            transition: 0.2s;
        }
        .product-detail-page .gallery .thumbnails img:hover {
            border-color: var(--accent, #facc15);
            transform: scale(1.05);
        }
        .product-detail-page .gallery .image-zoom-container .zoom-lens {
            display: none;
        }
        /* Miniaturas */
        .product-detail-page .gallery .thumbnails {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .product-detail-page .gallery .thumbnails img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid #e2e8f0;
            transition: 0.2s;
        }
        .product-detail-page .gallery .thumbnails img:hover {
            border-color: var(--accent, #facc15);
            transform: scale(1.05);
        }

        /* ----- INFORMAÇÕES DO PRODUTO ----- */
        .product-detail-page .info {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .product-detail-page .info h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-dark, #0f172a);
            margin-bottom: 5px;
        }
        /* Preço em moedas (menos destacado) */
        .product-detail-page .info .price-coins {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted, #64748b);
            background: #f1f5f9;
            padding: 4px 14px;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
        }
        .product-detail-page .info .price-coins strong {
            color: var(--accent, #facc15);
            font-size: 1.2rem;
        }
        /* Destaque para "Deseja em troca" */
        .product-detail-page .info .trade-wanted {
            background: linear-gradient(135deg, #f1f1f1, #f1f1f1);
            border: 2px solid #000000;
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 10px 0;
        }
        .product-detail-page .info .trade-wanted .icon {
            font-size: 2.5rem;
        }
        .product-detail-page .info .trade-wanted .text {
            font-size: 1.2rem;
            font-weight: 600;
            color: #0f172a;
        }
        .product-detail-page .info .trade-wanted .text span {
            color: #0c0c0c;
            font-weight: 700;
        }

        .product-detail-page .info .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 5px 0;
        }
        .product-detail-page .info .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 30px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        .product-detail-page .info .meta-item {
            display: flex;
            flex-direction: column;
        }
        .product-detail-page .info .meta-item .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 600;
        }
        .product-detail-page .info .meta-item .value {
            font-weight: 600;
            color: var(--text-dark, #0f172a);
        }
        .product-detail-page .info .description {
            font-size: 1rem;
            line-height: 1.6;
            color: #334155;
            white-space: pre-wrap;
        }
        .product-detail-page .info .description strong {
            display: block;
            margin-bottom: 5px;
            color: var(--text-dark, #0f172a);
        }
        .product-detail-page .info .actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .product-detail-page .info .actions button {
            padding: 14px 30px;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
            min-width: 150px;
        }
        .btn-buy {
            background: var(--accent, #facc15);
            color: var(--text-dark, #0f172a);
        }
        .btn-buy:hover {
            background: var(--accent-hover, #eab308);
            transform: translateY(-2px);
        }
        .btn-chat {
            background: #8b5cf6;
            color: white;
        }
        .btn-chat:hover {
            background: #7c3aed;
            transform: translateY(-2px);
        }
        .btn-back {
            background: #e2e8f0;
            color: var(--text-dark, #0f172a);
        }
        .btn-back:hover {
            background: #cbd5e1;
        }

        .loading {
            text-align: center;
            padding: 100px 20px;
            font-size: 1.2rem;
            color: #94a3b8;
        }
        .error-msg {
            text-align: center;
            padding: 100px 20px;
            font-size: 1.2rem;
            color: #ef4444;
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .product-detail-page {
                grid-template-columns: 1fr;
                padding: 20px;
            }
            .product-detail-page .gallery .image-zoom-container {
                height: 250px;
            }
            .product-detail-page .info h1 {
                font-size: 1.5rem;
            }
            .product-detail-page .info .trade-wanted {
                flex-direction: column;
                text-align: center;
            }
            .product-detail-page .info .trade-wanted .icon {
                font-size: 2rem;
            }
            .product-detail-page .info .trade-wanted .text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- ===== HEADER ===== -->
    <header>
        <div class="header-inner">
            <div class="header-row">
                <div class="logo-area">
                    <a href="index.html">
                        <img src="logo.png" alt="TrocaTudo" id="logo" />
                    </a>
                </div>
                <div class="search-bar">
                    <input type="text" id="searchText" placeholder="Buscar produtos..." />
                    <button class="btn-search" id="btnSearch">Buscar</button>
                </div>
                <div class="user-info" id="userInfoLoggedIn" style="display:none;">
                    <span class="user-name" id="displayName">Usuário</span>
                    <span class="coins-display" id="coinsDisplay">🪙 0</span>
                    <button class="btn btn-notification" id="btnNotifications">🔔 <span class="badge" id="notifBadge">0</span></button>
                    <button class="btn btn-logout" id="btnLogout">Sair</button>
                </div>
                <div class="user-info" id="userInfoLoggedOut">
                    <button class="btn btn-login" onclick="window.location.href='index.html'">Entrar</button>
                    <button class="btn btn-register" onclick="window.location.href='index.html'">Cadastrar</button>
                </div>
            </div>
        </div>
    </header>

    <!-- ===== CONTEÚDO ===== -->
    <div class="container">
        <div id="productDetailContainer">
            <div class="loading">⏳ Carregando produto...</div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast">✅ Ação concluída</div>

    <!-- Scripts -->
    <script type="importmap">
        {
            "imports": {
                "dexie": "https://unpkg.com/dexie@3/dist/dexie.mjs"
            }
        }
    </script>
    <script type="module" src="produto.js"></script>
</body>
</html>
